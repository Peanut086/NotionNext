name: 🚀 Auto Deploy NotionNext

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 27827  # ←←← 就是这行！告诉 Action 别连 22，连 27827！
          # ssh-action 默认命令超时 10 分钟，而服务器冷构建实测 14.5 分钟，
          # 到点就掐 → 镜像没换但 git 已经前进，线上看起来"部署失败"
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /www/wwwroot/NotionNext

            echo "📍 部署前 HEAD: $(git rev-parse --short HEAD)"
            # 仅打印工作区状态便于事后排查
            git status --porcelain

            # origin 走的是 githubfast.com 中转。它有两种坏法，都表现为「几十秒变红、
            # HEAD 原地不动、容器没被碰」：
            #   1) fetch 本身报错（抖动）；
            #   2) fetch 成功，但中转站还没同步到本次触发的 commit ——
            #      于是下面的 HEAD 断言立刻中止。2026-10-12 那次 39 秒变红就是这一种：
            #      几分钟后在服务器上 git ls-remote 已经能拿到同一个 sha。
            # 所以重试的条件必须是「拿回来的确实是 $sha」，而不是「fetch 没报错」。
            # 12 次 × 20 秒 ≈ 4 分钟窗口；command_timeout 是 60 分钟，等得起。
            sha='${{ github.sha }}'
            synced=0
            for i in $(seq 1 12); do
              if git fetch origin main && [ "$(git rev-parse FETCH_HEAD)" = "$sha" ]; then
                synced=1
                break
              fi
              echo "⏳ 第 $i 次：中转站还没有 $sha（或 fetch 失败），20 秒后重试"
              sleep 20
            done
            [ "$synced" = 1 ] || { echo "❌ 4 分钟内中转站始终没同步到 $sha，中止（未构建，线上仍是旧镜像）"; exit 1; }

            # 只允许快进：分叉或本地改动会直接让部署变红，
            # 而不是静默用旧源码构建出"部署成功"的旧镜像
            git merge --ff-only FETCH_HEAD
            echo "📍 部署后 HEAD: $(git rev-parse --short HEAD)"

            # 二次确认：构建前源码必须真的是本次触发的那次提交
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "❌ HEAD 与触发 commit ${{ github.sha }} 不一致，中止构建"
              exit 1
            fi

            docker build --build-arg NEXT_DEBUG=true -t my-app .
            docker rm -f app 2>/dev/null || true
            docker run -d -p 3000:3000 --name app --restart unless-stopped my-app
            echo "✅ $(date): 自动部署成功！"
